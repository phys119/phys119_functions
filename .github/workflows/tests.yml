name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is what the course JupyterHub runs; keep it in the matrix.
        python-version: ["3.9", "3.10", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install ".[test]"
      - name: Run tests against the installed package
        working-directory: tests
        run: python -m pytest -q

  server-versions:
    # The versions the course JupyterHub runs, so a numpy difference cannot
    # reach students without failing here first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install with the server's numpy, matplotlib and widget packages
        run: |
          python -m pip install ".[test]"
          python -m pip install "numpy==1.26.0" "matplotlib==3.8.0" \
              "anywidget==0.11.0" "psygnal==0.16.1" "ipywidgets==8.1.1"
      - name: Show what is installed
        run: python -c "import numpy, matplotlib, anywidget, sys; print(sys.version); print(numpy.__version__, matplotlib.__version__, anywidget.__version__)"
      - name: Run tests against the installed package
        working-directory: tests
        run: python -m pytest -q
