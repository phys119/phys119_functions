[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phys119-functions"
version = "1.0.0"
description = "Beginner-friendly measurement and uncertainty helpers for the UBC Phys 119 lab course"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joss Ives", email = "jossives@gmail.com" }]
keywords = ["physics", "teaching", "uncertainty", "lab", "phys119"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
py-modules = ["phys119_functions"]

[tool.setuptools.package-dir]
"" = "src"
