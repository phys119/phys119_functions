[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phys119-functions"
version = "1.3.0"
description = "Beginner-friendly measurement, uncertainty and plotting helpers for the UBC Phys 119 lab course"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joss Ives", email = "jossives@users.noreply.github.com" }]
keywords = ["physics", "teaching", "uncertainty", "lab", "phys119"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Physics",
]
# anywidget is for manual_fit, the interactive fit drawn in the notebook.
dependencies = ["numpy>=1.20", "matplotlib>=3.5", "anywidget>=0.11"]

[project.urls]
Homepage = "https://github.com/phys119/phys119_functions"
Issues = "https://github.com/phys119/phys119_functions/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
py-modules = ["phys119_functions"]

[tool.setuptools.package-dir]
"" = "src"
